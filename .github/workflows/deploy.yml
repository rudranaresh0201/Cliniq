name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "deploy@cliniq.app"
          git config user.name "ClinIQ Deploy Bot"
          git remote add hf https://user:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE }}
          git push hf main --force
