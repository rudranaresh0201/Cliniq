name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "deploy@cliniq.ai"
          git config user.name "ClinIQ Deploy"
          git remote add hf https://rudranaresh0201:$HF_TOKEN@huggingface.co/spaces/rudranaresh0201/cliniq-backend || true
          git push hf main --force
